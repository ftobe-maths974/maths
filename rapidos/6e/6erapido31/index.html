[b] bleues**.\nOn tire une bille au hasard.\nQuelle est la probabilité de tirer une bille **bleue** ?\n\n$p =$ [frac?{b}{10}] $=$ [?b/10] $=$ [?b*10] %\n"},{"id":"cartes","content":"[#f:2..8]On utilise un jeu de **10 cartes** numérotées de 1 à 10. On tire une carte au hasard.\nQuelle est la probabilité d'obtenir un nombre **inférieur ou égal à [f]** ?\n\n$p =$ [frac?{f}{10}] $=$ [?f/10] $=$ [?f*10] %\n"},{"id":"roue","content":"[#v:1..3]Une roue est divisée en **4 secteurs** égaux, dont **[v]** verts et **[=4-v]** rouges.\nOn fait tourner la roue.\nQuelle est la probabilité de tomber sur le **vert** ?\n\n$p =$ [frac?{v}{4}] $=$ [?v/4] $=$ [?v*25] %\n"},{"id":"bonbons","content":"[#c:1..4]Dans une boîte, il y a **5 bonbons** : **[c]** citron et **[=5-c]** framboise.\nOn en pioche un au hasard.\nQuelle est la probabilité d'obtenir un bonbon **citron** ?\n\n$p =$ [frac?{c}{5}] $=$ [?c/5] $=$ [?c*20] %\n"},{"id":"yaourts","content":"[#e:2..8]À la cantine, il reste **[=e*2] yaourts à la fraise** et **[=20-e*2] yaourts à la vanille**.\nSi tu en prends un sans regarder, quelle est la probabilité qu'il soit à la **fraise** ?\n\n$p =$ [frac?{e*2}{20}] $=$ [?e*2/20] $=$ [?e*10] %\n"},{"id":"complementaire","content":"[#o:2..7]Dans une corbeille, il y a **[o] oranges** et **[=10-o] autres fruits** (pommes et bananes).\nOn en prend un au hasard.\nQuelle est la probabilité de **ne pas** prendre une orange ?\n\n$p =$ [frac?{10-o}{10}] $=$ [?(10-o)/10] $=$ [?(10-o)*10] %\n"},{"id":"voyelles","content":"On écrit chaque lettre du prénom « MARIE » sur des petits papiers et on les mélange.\nOn en tire un au hasard.\nQuelle est la probabilité de piocher une **voyelle** ?\n\n*(Les voyelles de MARIE sont : A, I et E.)*\n\n$p =$ [frac?{3}{5}] $=$ [?0.6] $=$ [?60] %\n"}],"defautIndex":4,"gs":"GS 23.3","theme":"Organisation et gestion de données, Probabilités","ref":"23.03-calculer-probabilite"},{"variantes":[{"id":"train-paris","texte":"Un train part de Paris à 10 h 20 et le voyage dure 2
