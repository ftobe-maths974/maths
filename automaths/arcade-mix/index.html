      // Tab : si l'élève vient d'un .rapido-input, on saute directement à
      // l'input rapido suivant/précédent (sinon MathJax pose tabindex=0 sur
      // ses sous-éléments → le focus atterrit sur la formule entre 2 inputs).
      // Scope : tous les .rapido-input de la carte sauf ceux d'une variante
      // inactive — couvre les visuels position:content (texte-trous) qui
      // montent leurs inputs dans .q-content-visual, frère de .variant-content.
      document.addEventListener('keydown', e => {
        if (e.key !== 'Tab' || e.altKey || e.ctrlKey || e.metaKey) return;
        const active = document.activeElement;
        if (!active || !active.classList.contains('rapido-input')) return;
        const card = active.closest('.q-card');
        if (!card) return;
        const inputs = [...card.querySelectorAll('.rapido-input')]
          .filter(el => !el.closest('.variant-content:not(.active)'));
        const idx = inputs.indexOf(active);
        if (idx < 0) return;
        e.preventDefault();
        const step = e.shiftKey ? -1 : 1;
        const len  = inputs.length;
        const next = inputs[((idx + step) % len + len) % len];
        next?.focus();
      });

    function updatePrintPageSize(mode) {
      let styleEl = document.getElementById('dynamic-page-size');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'dynamic-page-size';
        styleEl.setAttribute('media', 'print');
        document.head.appendChild(styleEl);
      }
      if (mode === 'a5') {

      }
    }

    function setMode(mode) {
      body.setAttribute('data-layout-mode', mode);
      localStorage.setItem('maths974-display-mode', mode);
      modes.forEach(opt => opt.classList.toggle('active', opt.dataset.mode === mode));
      updatePrintPageSize(mode);
    }

    modes.forEach(opt => opt.addEventListener('click', () => {
      setMode(opt.dataset.mode);
      toggleMenu(false);
    }));

    // ── Menu hamburger ────────────────────────────────────────────────────
    function toggleMenu(show) {
      if (!menu) return;
      if (show) { menu.classList.remove('hidden'); btn.setAttribute('aria-expanded', 'true'); }

        toggleMenu(btn.getAttribute('aria-expanded') !== 'true');
      });
    }
    document.addEventListener('click', e => {
      if (menu && !menu.contains(e.target) && !btn.contains(e.target)) toggleMenu(false);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleMenu(false); });
  })();
