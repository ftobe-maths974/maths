*2] €**.\nCes deux grandeurs sont-elles proportionnelles ? [vf:1]\n","texte":"","type":"","config":null,"rand":null,"reponse":"","enonces":null,"gs":""},{"i":1,"id":"farine-oui","niveau":"","groupe":"","content":"[#n:5,10,20][#g:50,100,200]Pour **[n] gâteaux**, il faut **[g] g** de farine.\nPour le double — **[=n*2] gâteaux** — il faut **[=g*2] g** de farine.\nLa quantité de farine est-elle proportionnelle au nombre de gâteaux ? [vf:1]\n","texte":"","type":"","config":null,"rand":null,"reponse":"","enonces":null,"gs":""},{"i":2,"id":"randonnee-oui","niveau":"","groupe":"","content":"[#d:3..6][#t:15,20,30]Un randonneur parcourt **[d] km** en **[t] min**.\nÀ la même allure, il parcourt **[=d*2] km** en **[=t*2] min**.\nLa distance est-elle proportionnelle au temps ? [vf:1]\n","texte":"","type":"","config":null,"rand":null,"reponse":"","enonces":null,"gs":""},{"i":3,"id":"forfait-non","niveau":"","groupe":"","content":"[#a:20,30,40][#p:10,12,15][#f:3,5,7]Un forfait téléphone : **[a] min** de communication coûtent **[p] €**.\nLe double — **[=a*2] min** — coûte **[=p+f] €** (abonnement inclus).\nCes deux grandeurs sont-elles proportionnelles ? [vf:0]\n","texte":"","type":"","config":null,"rand":null,"reponse":"","enonces":null,"gs":""},{"i":4,"id":"age-taille-non","niveau":"","groupe":"","content":"[#a:8,10,12][#t:130,140,150][#da:2,3,4][#dt:5,7,9]À **[a] ans**, un enfant mesure **[t] cm**.\nÀ **[=a+da] ans**, il mesure **[=t+dt] cm**.\nL'âge et la taille sont-ils proportionnels ? [vf:0]\n","texte":"","type":"","config":null,"rand":null,"reponse":"","enonces":null,"gs":""},{"i":5,"id":"livraison-non","niveau":"","groupe":"","content":"[#n:2..5][#p:3..6][#f:2,3,4]Une boutique vend **[n] chemises** pour **[=n*p+f] €** (livraison incluse).\nLe double — **[=n*2] chemises** — coûte **[=n*2*p+f] €** (mêmes frais de livraison).\nCes deux grandeurs sont-elles proportionnelles ? [vf:0]\n","texte":"","type":"","config":null,"rand":null,"reponse":"","enonces":null,"gs":""}]},{"slug
