u hasard.\nQuelle est la probabilité d'obtenir un bonbon **citron** ?\n\n$p =$ [frac?{c}{5}] $=$ [?c/5] $=$ [?c*20] %\n","texte":"","type":"","config":null,"rand":null,"reponse":"","enonces":null,"gs":""},{"i":4,"id":"yaourts","niveau":"","groupe":"","content":"[#e:2..8]À la cantine, il reste **[=e*2] yaourts à la fraise** et **[=20-e*2] yaourts à la vanille**.\nSi tu en prends un sans regarder, quelle est la probabilité qu'il soit à la **fraise** ?\n\n$p =$ [frac?{e*2}{20}] $=$ [?e*2/20] $=$ [?e*10] %\n","texte":"","type":"","config":null,"rand":null,"reponse":"","enonces":null,"gs":""},{"i":5,"id":"complementaire","niveau":"","groupe":"","content":"[#o:2..7]Dans une corbeille, il y a **[o] oranges** et **[=10-o] autres fruits** (pommes et bananes).\nOn en prend un au hasard.\nQuelle est la probabilité de **ne pas** prendre une orange ?\n\n$p =$ [frac?{10-o}{10}] $=$ [?(10-o)/10] $=$ [?(10-o)*10] %\n","texte":"","type":"","config":null,"rand":null,"reponse":"","enonces":null,"gs":""},{"i":6,"id":"voyelles","niveau":"","groupe":"","content":"On écrit chaque lettre du prénom « MARIE » sur des petits papiers et on les mélange.\nOn en tire un au hasard.\nQuelle est la probabilité de piocher une **voyelle** ?\n\n*(Les voyelles de MARIE sont : A, I et E.)*\n\n$p =$ [frac?{3}{5}] $=$ [?0.6] $=$ [?60] %\n","texte":"","type":"","config":null,"rand":null,"reponse":"","enonces":null,"gs":""}]},{"slug":"cycle3/05-proportionnalite/24-proportionnalite/2401-reconnaitre-proportionnalite","id":"cycle3/05-proportionnalite/24-proportionnalite/24.01-reconnaitre-proportionnalite.md","title":"24.1 Reconnaître une situation de proportionnalité","gs":"GS 24.1","gs_bonus":"","theme":"Proportionnalité","variantes":[{"i":0,"id":"mangues-oui","niveau":"","groupe":"","content":"[#n:2..5][#p:2..4]Au marché, **[n] mangues** coûtent **[p] €**.\nLe double — **[=n*2] mangues** — coûte **[=p*2] €**.\nCes deux grandeurs sont-elles proportionnelles ? [vf:1]\n","texte":"","type":"","config":null,"rand"
