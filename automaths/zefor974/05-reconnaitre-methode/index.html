    // Tab du clavier : MathJax pose tabindex="0" sur des sous-éléments des
    // formules → le focus atterrissait sur la formule entre 2 inputs au lieu
    // de l'input suivant. Intercept direct : si on Tab depuis un .rapido-input,
    // on force le focus vers l'input rapido précédent/suivant de la variante
    // active (boucle aux extrémités). Shift+Tab = recule.
    //
    // Scope : tous les .rapido-input de la carte SAUF ceux d'une variante
    // inactive. Couvre aussi les visuels position:content (ex. texte-trous)
    // dont les inputs sont montés dans .q-content-visual (frère, pas enfant,
    // de .variant-content) — un sélecteur `.variant-content.active …` les
    // raterait.
    document.addEventListener('keydown', e => {
      if (e.key !== 'Tab' || e.altKey || e.ctrlKey || e.metaKey) return;
      const active = document.activeElement;
      if (!active || !active.classList.contains('rapido-input')) return;
      const card = active.closest('.q-card');
      if (!card) return;
      const inputs = [...card.querySelectorAll('.rapido-input')]
        .filter(el => !el.closest('.variant-content:not(.active)'));
      const idx = inputs.indexOf(active);
      if (idx < 0) return;
      e.preventDefault();
      const step = e.shiftKey ? -1 : 1;
      const len  = inputs.length;
      const next = inputs[((idx + step) % len + len) % len];
      if (next === active) {
        // Cas single-input dans la carte (ex. visuel Zefor avec schéma replié) :
        // la « boucle » pointe sur soi-même → pas de focus change → pas de blur
        // → pas de validation. On force blur() pour déclencher wireCardInputs.
        active.blur();
      } else {
        next?.focus();
      }
    });
